<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angle Relationships Practice</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-radius: 8px;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
        }
        svg {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            max-width: 100%;
            height: auto;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .dropdown-group {
            background: #f1f5f9;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            text-align: left;
            font-weight: 500;
        }
        .dropdown-group select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            margin-top: 10px;
            border-radius: var(--border-radius);
            border: 1px solid #cbd5e1;
            background: white;
            cursor: pointer;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: var(--border-radius);
            width: 120px;
        }
        button {
            padding: 10px 16px;
            font-size: 1rem;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #submit-btn { background-color: var(--primary); color: white; }
        #cbd-btn { background-color: #dc2626; color: white; }
        #skip-btn { background-color: #64748b; color: white; }
        
        .feedback {
            padding: 15px;
            border-radius: var(--border-radius);
            font-weight: 500;
            display: none;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.4;
        }
        .feedback.correct {
            background-color: #dcfce7;
            color: #166534;
            display: block;
        }
        .feedback.incorrect {
            background-color: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .stats-panel {
            background: #e2e8f0;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-top: 25px;
            text-align: left;
            font-size: 0.95rem;
        }
        .stats-panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #334155;
        }
        .stats-panel p {
            margin: 5px 0;
            font-weight: 500;
        }
        
        /* SVG Styling */
        line { stroke: #334155; stroke-width: 3; }
        text { font-family: monospace; font-size: 20px; font-weight: bold; fill: var(--primary); }
        .parallel-marker { fill: none; stroke: #dc2626; stroke-width: 3; }
    </style>
</head>
<body>

<div class="container">
    <h1>Angle Relationships Practice</h1>
    <svg id="canvas" width="400" height="400" viewBox="0 0 400 400"></svg>
    
    <div id="feedback" class="feedback"></div>
    
    <div class="question-text" id="question"></div>
    
    <div class="dropdown-group">
        <label>The angle relationship between Angle <span id="lbl-given"></span> and Angle <span id="lbl-target"></span> is:</label>
        <select id="rel-select">
            <option value="">-- Select Relationship --</option>
            <option value="vertical">Vertical Angles</option>
            <option value="linear">Straight Angle Pair</option>
            <option value="corresponding">Corresponding Angles</option>
            <option value="alternate_interior">Alternate Interior Angles</option>
            <option value="same_side_interior">Same-Side Interior Angles</option>
        </select>
    </div>
    
    <div class="controls">
        <input type="number" id="degree-input" placeholder="Degrees°">
        <button id="submit-btn">Submit Measure</button>
        <button id="cbd-btn">Cannot be determined</button>
        <button id="skip-btn">Next Problem</button>
    </div>

    <div class="stats-panel" id="stats-panel" style="display: none;">
        <h3>Session Stats (Last 30 Attempts)</h3>
        <p>Relationship Accuracy: <span id="stat-rel-acc">0%</span></p>
        <p>Measure Accuracy: <span id="stat-meas-acc">0%</span></p>
        <p>Needing review: <strong id="stat-review" style="color: #b91c1c;">None</strong></p>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const questionEl = document.getElementById('question');
    const degreeInput = document.getElementById('degree-input');
    const feedbackEl = document.getElementById('feedback');
    const relSelect = document.getElementById('rel-select');
    const lblGiven = document.getElementById('lbl-given');
    const lblTarget = document.getElementById('lbl-target');
    const statsPanel = document.getElementById('stats-panel');

    let currentProblem = null;
    let attemptHistory = []; // Array to hold last 30 problem results

    const relNames = {
        'vertical': 'Vertical Angles',
        'linear': 'Straight Angle Pair',
        'corresponding': 'Corresponding Angles',
        'alternate_interior': 'Alternate Interior Angles',
        'same_side_interior': 'Same-Side Interior Angles'
    };

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function drawProblem(type) {
        canvas.innerHTML = '';
        let anglesData = [];
        
        if (type === 0) {
            // SINGLE INTERSECTION
            canvas.innerHTML += `<line x1="50" y1="200" x2="350" y2="200" />`;
            canvas.innerHTML += `<line x1="120" y1="320" x2="280" y2="80" />`;
            
            canvas.innerHTML += `
                <text x="215" y="185">A</text>
                <text x="155" y="185">B</text>
                <text x="165" y="235">C</text>
                <text x="225" y="235">D</text>
            `;
            
            const baseAngle = getRandomInt(40, 140);
            anglesData = [
                { id: 'A', group: 1, val: baseAngle },
                { id: 'B', group: 1, val: 180 - baseAngle },
                { id: 'C', group: 1, val: baseAngle },
                { id: 'D', group: 1, val: 180 - baseAngle }
            ];
            
        } else if (type === 1) {
            // PARALLEL TRANSVERSAL
            canvas.innerHTML += `<line x1="50" y1="150" x2="350" y2="150" />`;
            canvas.innerHTML += `<line x1="50" y1="280" x2="350" y2="280" />`;
            canvas.innerHTML += `<line x1="120" y1="50" x2="250" y2="350" />`;
            
            canvas.innerHTML += `
                <path class="parallel-marker" d="M 320 140 L 330 150 L 320 160" />
                <path class="parallel-marker" d="M 320 270 L 330 280 L 320 290" />
            `;
            
            canvas.innerHTML += `
                <text x="180" y="135">A</text>
                <text x="135" y="135">B</text>
                <text x="145" y="185">C</text>
                <text x="190" y="185">D</text>
                
                <text x="235" y="265">E</text>
                <text x="190" y="265">F</text>
                <text x="200" y="315">G</text>
                <text x="245" y="315">H</text>
            `;
            
            const baseAngle = getRandomInt(40, 140);
            anglesData = [
                { id: 'A', group: 1, val: baseAngle },
                { id: 'B', group: 1, val: 180 - baseAngle },
                { id: 'C', group: 1, val: baseAngle },
                { id: 'D', group: 1, val: 180 - baseAngle },
                { id: 'E', group: 2, val: baseAngle },
                { id: 'F', group: 2, val: 180 - baseAngle },
                { id: 'G', group: 2, val: baseAngle },
                { id: 'H', group: 2, val: 180 - baseAngle }
            ];
            
        } else {
            // NON-PARALLEL TRANSVERSAL
            canvas.innerHTML += `<line x1="50" y1="120" x2="350" y2="180" />`;
            canvas.innerHTML += `<line x1="50" y1="280" x2="350" y2="250" />`;
            canvas.innerHTML += `<line x1="120" y1="50" x2="280" y2="350" />`;
            
            canvas.innerHTML += `
                <text x="185" y="125">A</text>
                <text x="135" y="135">B</text>
                <text x="155" y="185">C</text>
                <text x="205" y="175">D</text>
                
                <text x="250" y="250">E</text>
                <text x="195" y="265">F</text>
                <text x="210" y="315">G</text>
                <text x="265" y="300">H</text>
            `;
            
            const topBase = getRandomInt(50, 130);
            let bottomBase = getRandomInt(50, 130);
            while (Math.abs(topBase - bottomBase) < 15) {
                bottomBase = getRandomInt(50, 130);
            }
            
            anglesData = [
                { id: 'A', group: 1, val: topBase },
                { id: 'B', group: 1, val: 180 - topBase },
                { id: 'C', group: 1, val: topBase },
                { id: 'D', group: 1, val: 180 - topBase },
                { id: 'E', group: 2, val: bottomBase },
                { id: 'F', group: 2, val: 180 - bottomBase },
                { id: 'G', group: 2, val: bottomBase },
                { id: 'H', group: 2, val: 180 - bottomBase }
            ];
        }
        
        return { type, anglesData };
    }

    function getRelationship(id1, id2) {
        const pair = [id1, id2].sort().join('');
        
        if (['AC', 'BD', 'EG', 'FH'].includes(pair)) return 'vertical';
        if (['AB', 'AD', 'BC', 'CD', 'EF', 'EH', 'FG', 'GH'].includes(pair)) return 'linear';
        if (['AE', 'BF', 'CG', 'DH'].includes(pair)) return 'corresponding';
        if (['CE', 'DF'].includes(pair)) return 'alternate_interior';
        if (['CF', 'DE'].includes(pair)) return 'same_side_interior';
        
        return null;
    }

    function generateProblem() {
        feedbackEl.className = 'feedback';
        degreeInput.value = '';
        relSelect.value = '';
        
        const type = getRandomInt(0, 2);
        const data = drawProblem(type);
        
        const aIndex = getRandomInt(0, data.anglesData.length - 1);
        const givenAngle = data.anglesData[aIndex];
        
        const validTargets = data.anglesData.filter(t => {
            if (t.id === givenAngle.id) return false;
            return getRelationship(givenAngle.id, t.id) !== null;
        });
        
        const targetAngle = validTargets[getRandomInt(0, validTargets.length - 1)];
        const actualRelId = getRelationship(givenAngle.id, targetAngle.id);
        
        let isDeterminable = true;
        if (type === 2 && givenAngle.group !== targetAngle.group) {
            isDeterminable = false;
        }
        
        currentProblem = {
            type: type,
            givenId: givenAngle.id,
            givenVal: givenAngle.val,
            givenGroup: givenAngle.group,
            targetId: targetAngle.id,
            targetVal: targetAngle.val,
            targetGroup: targetAngle.group,
            isDeterminable: isDeterminable,
            actualRelId: actualRelId,
            logged: false // Prevents multiple submissions counting against stats
        };
        
        questionEl.textContent = `If m∠${currentProblem.givenId} = ${currentProblem.givenVal}°, what is m∠${currentProblem.targetId}?`;
        lblGiven.textContent = currentProblem.givenId;
        lblTarget.textContent = currentProblem.targetId;
    }

    function updateStatsPanel() {
        if (attemptHistory.length === 0) return;
        statsPanel.style.display = 'block';

        let relCorrectCount = 0;
        let measCorrectCount = 0;
        let missedRelationships = {}; // Keep tally of which relationships they missed

        attemptHistory.forEach(attempt => {
            if (attempt.relCorrect) relCorrectCount++;
            if (attempt.measureCorrect) measCorrectCount++;

            // If they missed either the relationship or the measure, add it to the missed tally
            if (!attempt.relCorrect || !attempt.measureCorrect) {
                missedRelationships[attempt.actualRelId] = (missedRelationships[attempt.actualRelId] || 0) + 1;
            }
        });

        const relAcc = Math.round((relCorrectCount / attemptHistory.length) * 100);
        const measAcc = Math.round((measCorrectCount / attemptHistory.length) * 100);

        document.getElementById('stat-rel-acc').textContent = `${relAcc}%`;
        document.getElementById('stat-meas-acc').textContent = `${measAcc}%`;

        // Find the most missed relationship
        let worstRel = null;
        let maxMisses = 0;

        for (const [relId, count] of Object.entries(missedRelationships)) {
            if (count > maxMisses) {
                maxMisses = count;
                worstRel = relId;
            }
        }

        const reviewSpan = document.getElementById('stat-review');
        if (worstRel && maxMisses > 0) {
            reviewSpan.textContent = `[${relNames[worstRel].toLowerCase()}]`;
        } else {
            reviewSpan.textContent = 'None';
        }
    }

    function checkAnswer(userChoice, userValue = null) {
        if (!currentProblem) return;
        
        const userRelId = relSelect.value;
        if (!userRelId) {
            alert("Please select the angle relationship from the dropdown first.");
            return;
        }
        
        const actualRelId = currentProblem.actualRelId;
        const actualRelName = relNames[actualRelId];
        const userRelName = relNames[userRelId];
        const relCorrect = (userRelId === actualRelId);
        
        let measureCorrect = false;
        let isCorrect = false;
        let message = '';
        
        let relExplanation = `Angle ${currentProblem.givenId} and Angle ${currentProblem.targetId} are <strong>${actualRelName}</strong>.`;
        if (currentProblem.type === 2 && currentProblem.givenGroup !== currentProblem.targetGroup) {
            relExplanation += ` However, because the lines are NOT marked as parallel, their exact measure relationship cannot be determined.`;
        } else if (currentProblem.type === 1 && currentProblem.givenGroup !== currentProblem.targetGroup) {
            relExplanation += ` Because the lines are marked as parallel, their measures can be calculated.`;
        } else {
            relExplanation += ` Since they share an intersection, you can always calculate their measures.`;
        }
        
        if (userChoice === 'cbd') {
            measureCorrect = !currentProblem.isDeterminable;

            if (!currentProblem.isDeterminable) {
                if (relCorrect) {
                    isCorrect = true;
                    message = `<strong>Correct!</strong> ${relExplanation}`;
                } else {
                    isCorrect = false;
                    message = `<strong>Incorrect Relationship.</strong> You were correct that it "Cannot be determined", but they are NOT ${userRelName}. ${relExplanation}`;
                }
            } else {
                isCorrect = false;
                if (relCorrect) {
                    message = `<strong>Incorrect Measure.</strong> You correctly identified them as ${userRelName}, but the measure CAN be determined! ${relExplanation} The correct answer is <strong>${currentProblem.targetVal}°</strong>.`;
                } else {
                    message = `<strong>Incorrect.</strong> The measure CAN be determined, and they are not ${userRelName}. ${relExplanation} The correct answer is <strong>${currentProblem.targetVal}°</strong>.`;
                }
            }
        } else if (userChoice === 'measure') {
            measureCorrect = (currentProblem.isDeterminable && userValue === currentProblem.targetVal);

            if (!currentProblem.isDeterminable) {
                isCorrect = false;
                if (relCorrect) {
                    message = `<strong>Incorrect Measure.</strong> You correctly identified them as ${userRelName}, but you provided a measure when it "Cannot be determined". ${relExplanation}`;
                } else {
                    message = `<strong>Incorrect.</strong> You entered ${userValue}°, but the answer is "Cannot be determined". Also, they are not ${userRelName}. ${relExplanation}`;
                }
            } else {
                if (relCorrect && measureCorrect) {
                    isCorrect = true;
                    message = `<strong>Correct!</strong> m∠${currentProblem.targetId} = ${currentProblem.targetVal}°. ${relExplanation}`;
                } else if (relCorrect && !measureCorrect) {
                    isCorrect = false;
                    message = `<strong>Incorrect Measure.</strong> You correctly identified them as ${userRelName}, but m∠${currentProblem.targetId} is <strong>${currentProblem.targetVal}°</strong>, not ${userValue}°. ${relExplanation}`;
                } else if (!relCorrect && measureCorrect) {
                    isCorrect = false;
                    message = `<strong>Incorrect Relationship.</strong> You got the measure right (${currentProblem.targetVal}°), but they are NOT ${userRelName}. ${relExplanation}`;
                } else {
                    isCorrect = false;
                    message = `<strong>Incorrect.</strong> You entered ${userValue}° and selected ${userRelName}. ${relExplanation} The correct answer is <strong>${currentProblem.targetVal}°</strong>.`;
                }
            }
        }
        
        feedbackEl.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedbackEl.innerHTML = message;

        // Log to stats if it's the first time they submit this problem
        if (!currentProblem.logged) {
            currentProblem.logged = true;
            attemptHistory.push({
                relCorrect: relCorrect,
                measureCorrect: measureCorrect,
                actualRelId: actualRelId
            });

            // Keep only the last 30 attempts
            if (attemptHistory.length > 30) {
                attemptHistory.shift(); 
            }
            updateStatsPanel();
        }
    }

    // Controls
    document.getElementById('submit-btn').addEventListener('click', () => {
        const val = parseInt(degreeInput.value, 10);
        if (isNaN(val)) {
            alert("Please enter a degree measure.");
            return;
        }
        checkAnswer('measure', val);
    });

    document.getElementById('cbd-btn').addEventListener('click', () => {
        degreeInput.value = '';
        checkAnswer('cbd');
    });

    document.getElementById('skip-btn').addEventListener('click', generateProblem);

    // Initial setup
    generateProblem();
</script>

</body>
</html>
